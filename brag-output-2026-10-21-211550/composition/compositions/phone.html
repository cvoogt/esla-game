  <div id="root" data-composition-id="phone" data-width="1920" data-height="1080">
    <div id="phone-body">
      <div id="phone-screen">
        <div id="phone-island"></div>
        <div id="phone-status" data-layout-ignore><span>4:12</span><span>5G ▮▮▮</span></div>

        <div id="phone-tap"></div>

  <script>
    // Data from the app's src/rules.ts.
    const SWATCH = { white: "#f5f5f5", grey: "#7d828a", black: "#151515", blue: "#2563eb", silver: "#c0c4c9", red: "#dc2626", pink: "#f472b6", purple: "#8b5cf6" };
    const CARS = [["white", "Wesla", 2], ["grey", "Gresla", 1], ["black", "Blesla", 1], ["blue", "Blusla", 1], ["silver", "Sesla", 1], ["red", "Resla", 1], ["pink", "Pesla", 1], ["purple", "Puresla", 1]];
    const TRUCKS = [["white", "Whuck", 3], ["grey", "Gruck", 2], ["black", "Bluck", 2], ["blue", "Blueck", 2], ["silver", "Suck", 2], ["red", "Ruck", 2], ["pink", "Puck", 2], ["purple", "Puruck", 2]];

    // Film times (seconds from the start of the video). This scene starts at 4.0.
    const SCENE_START = 4.0;
    const T = { reveal: 4.25, outro: 17.25 };
    const PLAYERS = ["Maya", "Dad", "Leo"];
    const BASE = { Maya: { s: 24, wc: 4, wt: 1 }, Dad: { s: 21, wc: 3, wt: 0 }, Leo: { s: 19, wc: 2, wt: 1 } };
    const DEMO = [
      { who: "Maya", open: 7.75, taps: [{ t: 8.55, sel: '[data-k="truck"]', set: { vehicle: "truck" } }], score: { t: 9.35, sel: '[data-k="Whuck"]', pts: 3, label: "Whuck", wt: 1 } },
      { who: "Leo", open: 11.6, taps: [{ t: 12.2, sel: '[data-k="missed"]', set: { missed: true } }, { t: 12.65, sel: '[data-k="truck"]', set: { vehicle: "truck" } }], score: { t: 13.2, sel: '[data-k="Whuck"]', pts: -3, label: "Missed Whuck" } },
      // beat-locked: points land at 15.75s
      { who: "Dad", open: 14.75, taps: [], score: { t: 15.6, sel: '[data-k="dealer"]', pts: 50, label: "Dealership" } },
    ];

    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const lin = (t, a, b) => clamp((t - a) / (b - a));
    const eo = (x) => 1 - Math.pow(1 - x, 3);
    const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const fmt = (p) => (p > 0 ? `+${p}` : p < 0 ? `−${-p}` : "0");

    function stateAt(t) {
      const sc = JSON.parse(JSON.stringify(BASE));
      let sheet = null, toast = null, tap = null, events = 37, rankP = 0;
      const flash = {};
      for (const d of DEMO) {
        if (t >= d.open - 0.25 && t < d.open + 0.12) tap = { sel: `[data-card="${d.who}"]`, p: lin(t, d.open - 0.25, d.open + 0.12) };
        if (t >= d.open && t < d.score.t + 0.3) {
          const st = { who: d.who, vehicle: "car", missed: false, p: eo(lin(t, d.open, d.open + 0.32)) };
          for (const k of d.taps) {
            if (t >= k.t - 0.25 && t < k.t + 0.12) tap = { sel: k.sel, p: lin(t, k.t - 0.25, k.t + 0.12) };
            if (t >= k.t) Object.assign(st, k.set);
          }
          if (t >= d.score.t - 0.25 && t < d.score.t + 0.12) tap = { sel: d.score.sel, p: lin(t, d.score.t - 0.25, d.score.t + 0.12) };
          if (t >= d.score.t) st.p = 1 - eio(lin(t, d.score.t + 0.05, d.score.t + 0.3));
          sheet = st;
        }
        if (t >= d.score.t + 0.12) {
          const k = eo(lin(t, d.score.t + 0.15, d.score.t + 0.65));
          const from = sc[d.who].s;
          sc[d.who].s += d.score.pts;
          sc[d.who].shown = Math.round(from + d.score.pts * k);
          if (d.score.wt) sc[d.who].wt += d.score.wt;
          events++;
          flash[d.who] = { good: d.score.pts > 0, p: lin(t, d.score.t + 0.15, d.score.t + 0.9) };
          toast = { text: `${d.who}: ${d.score.label} ${fmt(d.score.pts)}`, bad: d.score.pts < 0, p: eo(lin(t, d.score.t + 0.15, d.score.t + 0.4)) };
          if (d.who === "Dad") rankP = eio(lin(t, d.score.t + 0.45, d.score.t + 0.95));
        }
      }
      for (const p of PLAYERS) if (sc[p].shown === undefined) sc[p].shown = sc[p].s;
      return { sc, sheet, toast, flash, tap, events, rankP };
    }

    function cardsHTML(st) {
      // DOM order stays fixed; the rank swap animates with transforms.
      const order0 = ["Maya", "Dad", "Leo"], order1 = ["Dad", "Maya", "Leo"];
      // Positions for the swap are applied after layout in renderAt.
      return PLAYERS.map((p) => {
        const i0 = order0.indexOf(p), i1 = order1.indexOf(p);
        const rank = (st.rankP > 0.5 ? i1 : i0) + 1;
        const f = st.flash[p];
        let extra = p === "Dad" && st.rankP > 0 && st.rankP < 1 ? "z-index:2;" : "";
        if (f && f.p < 1) {
          const a = (1 - eo(f.p)) * 100;
          extra += `background: color-mix(in srgb, ${f.good ? "#14532d" : "#5a1a1a"} ${a}%, var(--panel));`;
          extra += `border-color: color-mix(in srgb, ${f.good ? "var(--good)" : "var(--bad)"} ${a}%, var(--line));`;
        }
        const s = st.sc[p];
        return `<button class="card" data-layout-allow-overlap data-card="${p}" style="${extra}">
          <span class="rank">${rank}</span><span class="name">${p}</span>
          <span class="whites"><span>⚪ ${s.wc}</span><span>⬜ ${s.wt}</span></span>
          <span class="score">${s.shown}</span></button>`;
      }).join("") + `<button class="link add-player">+ Add player</button>`;
    }

    function sheetHTML(sh) {
      const list = sh.vehicle === "car" ? CARS : TRUCKS;
      const sign = sh.missed ? -1 : 1;
      return `<div class="sheet-backdrop" data-layout-allow-occlusion data-layout-allow-overlap style="opacity:${sh.p}">
        <div data-layout-allow-occlusion data-layout-allow-overlap class="sheet ${sh.missed ? "is-missed" : ""}" style="transform:translateY(${(1 - sh.p) * 105}%)">
          <div class="sheet-handle"></div>
          <div class="chips">${PLAYERS.map((p) => `<button class="chip ${p === sh.who ? "on" : ""}">${p}</button>`).join("")}</div>
          <div class="seg"><button class="${!sh.missed ? "on" : ""}">✓ Called</button><button data-k="missed" class="${sh.missed ? "on danger" : ""}">✗ Missed</button></div>
          <div class="row"><div class="seg grow"><button class="${sh.vehicle === "car" ? "on" : ""}">Tesla</button><button data-k="truck" class="${sh.vehicle === "truck" ? "on" : ""}">Cybertruck</button></div>
            <button class="toggle">⛽ ×2</button></div>
          <div class="grid">${list.map(([c, call, pts]) => `<button class="color-btn" data-k="${call}"><span class="swatch ${sh.vehicle === "truck" ? "square" : ""}" style="background:${SWATCH[c]}"></span><span class="call">${call}</span><span class="pts">${fmt(sign * pts)}</span></button>`).join("")}</div>
          <div class="row"><button class="big special" data-k="dealer">🏢 Dealership <b>${fmt(sign * 50)}</b></button></div>
          <div class="row"><button class="big">✨ Custom</button><button class="big">± Adjust</button></div>
        </div></div>`;
    }

    function playHTML(st) {
      return `<div class="screen">
        <header class="bar" data-layout-allow-overlap><button class="link">← Home</button><h2>Esla</h2><button class="link">🔊</button></header>
        <div class="cards">${cardsHTML(st)}</div>
        <div class="footer row" data-layout-allow-overlap><button class="big" data-layout-allow-overlap>📜 Log (${st.events})</button><button class="big primary" data-layout-allow-overlap>🏁 End Game</button></div>
        ${st.toast ? `<div data-layout-allow-overlap class="toast ${st.toast.bad ? "bad" : ""}" style="opacity:${st.toast.p};transform:translateY(${(1 - st.toast.p) * 40}px)"><span>${st.toast.text}</span><button class="link">Undo</button></div>` : ""}
        ${st.sheet ? sheetHTML(st.sheet) : ""}
      </div>`;
    }

    function resultsHTML(st) {
      const MEDAL = ["🥇", "🥈", "🥉"];
      return `<div class="screen">
        <header class="bar"><button class="link">← Home</button><h2>Final</h2><span></span></header>
        <p class="muted center" style="margin:0">Oct 21, 2026, 4:12 PM</p>
        <div class="winner"><div class="trophy">🏆</div><div class="name">Dad</div></div>
        <div class="cards">${["Dad", "Maya", "Leo"].map((p, i) => { const s = st.sc[p]; return `<div class="card static"><span class="rank">${MEDAL[i]}</span><span class="name">${p}</span><span class="whites"><span>⚪ ${s.wc}</span><span>⬜ ${s.wt}</span></span><span class="score">${s.s}</span></div>`; }).join("")}</div>
        <div class="footer row"><button class="big danger">Delete</button><button class="big">✏️ Edit scores</button></div>
      </div>`;
    }

    const body = document.getElementById("phone-body");
    const screen = document.getElementById("phone-screen");
    const app = document.getElementById("phone-app");
    const tapEl = document.getElementById("phone-tap");

    function renderAt(t) {
      const pp = eo(lin(t, T.reveal - 0.25, T.reveal + 0.4));
      body.style.opacity = pp > 0 ? 1 : 0;
      body.style.transform = `translateX(${(1 - pp) * 900}px) rotate(${(1 - pp) * 8}deg)`;

      const st = stateAt(t);
      const push = eio(lin(t, T.outro + 0.05, T.outro + 0.5));
      let html = "";
      if (push < 1) html += `<div class="page" style="transform:translateX(${-push * 100}%)">${playHTML(st)}</div>`;
      if (push > 0) html += `<div class="page" style="transform:translateX(${(1 - push) * 100}%)">${resultsHTML(st)}</div>`;
      app.innerHTML = html;
      // The app's bottom sheet slides over the scoreboard by design.
      app.querySelectorAll(".bar, .bar *, .cards, .cards *, .footer, .footer *").forEach((el) => el.setAttribute("data-layout-allow-occlusion", ""));
      // Dad overtakes Maya: swap the two cards using their laid-out boxes.
      if (st.rankP > 0 && push < 1) {
        const maya = app.querySelector('[data-card="Maya"]'), dad = app.querySelector('[data-card="Dad"]');
        const dDad = (maya.offsetTop - dad.offsetTop) * st.rankP;
        const dMaya = (dad.offsetTop + dad.offsetHeight - maya.offsetHeight - maya.offsetTop) * st.rankP;
        dad.style.transform = `translateY(${dDad}px)`;
        maya.style.transform = `translateY(${dMaya}px)`;
      }

      tapEl.style.display = "none";
      if (st.tap) {
        const target = app.querySelector(st.tap.sel);
        if (target) {
          // Measured in the phone's unscaled layout space.
          let x = target.offsetWidth / 2, y = target.offsetHeight / 2, n = target;
          while (n && n !== screen) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
          const p = st.tap.p;
          const scale = p < 0.65 ? 0.6 + 0.4 * eo(p / 0.65) : 1 + (0.5 * (p - 0.65)) / 0.35;
          const op = p < 0.65 ? eo(p / 0.65) : 1 - (p - 0.65) / 0.35;
          tapEl.style.cssText = `display:block;left:${x}px;top:${y}px;transform:scale(${scale});opacity:${op}`;
          if (p > 0.45 && p < 0.75) target.style.transform = (target.style.transform || "") + " scale(0.96)";
        }
      }
    }

    const clock = { t: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(clock, { t: 0 }, { t: 17.5, duration: 17.5, ease: "none", onUpdate: () => renderAt(clock.t + SCENE_START) }, 0);
    renderAt(SCENE_START);
    window.__timelines["phone"] = tl;
  </script>
</template>
