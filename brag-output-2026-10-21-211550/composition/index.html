<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0d12;
        --text: #f1f3f7;
        --accent: #e31937;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.5" data-width="1920" data-height="1080">
      <!-- Scenes. Paint order: backdrop < hook / captions < phone -->
      <div id="backdrop" data-composition-id="backdrop" data-composition-src="compositions/backdrop.html" data-start="0" data-duration="21.5" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="cap-reveal" data-composition-id="cap-reveal" data-composition-src="compositions/cap-reveal.html" data-start="4.25" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="cap-call" data-composition-id="cap-call" data-composition-src="compositions/cap-call.html" data-start="7.25" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="cap-miss" data-composition-id="cap-miss" data-composition-src="compositions/cap-miss.html" data-start="11.25" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="cap-jackpot" data-composition-id="cap-jackpot" data-composition-src="compositions/cap-jackpot.html" data-start="14.25" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="cap-outro" data-composition-id="cap-outro" data-composition-src="compositions/cap-outro.html" data-start="17.25" data-duration="4.25" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="phone" data-composition-id="phone" data-composition-src="compositions/phone.html" data-start="4" data-duration="17.5" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <!-- Music: enters 0.27s into the track so its beat grid falls on 0.25 + 0.5k and its lift lands on the +50 at 15.75s -->
      <audio id="music" data-timeline-role="music" class="clip" data-start="0" data-duration="21.5" data-media-start="0.27" data-track-index="10" data-volume="0.34" data-fade-in="0.2" data-fade-out="1" src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3"></audio>

      <!-- beat-grid: hook words at 0.25 / 0.75 / 1.25 / 1.75 -->
      <audio id="sfx-word-1" class="clip" data-start="0.27" data-duration="0.18" data-track-index="11" data-volume="0.7" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-word-2" class="clip" data-start="0.77" data-duration="0.15" data-track-index="12" data-volume="0.7" src="assets/sfx/impact/impactSoft_medium_004.ogg"></audio>
      <audio id="sfx-word-3" class="clip" data-start="1.27" data-duration="0.14" data-track-index="11" data-volume="0.7" src="assets/sfx/impact/impactSoft_medium_002.ogg"></audio>
      <audio id="sfx-word-4" class="clip" data-start="1.77" data-duration="0.14" data-track-index="12" data-volume="0.75" src="assets/sfx/impact/impactSoft_medium_003.ogg"></audio>

      <audio id="sfx-phone-in" class="clip" data-start="3.98" data-duration="0.6" data-track-index="13" data-volume="0.55" src="assets/sfx/casino/card-slide-1.ogg"></audio>

      <!-- Taps (click at the press) -->
      <audio id="sfx-tap-1" class="clip" data-start="7.7" data-duration="0.06" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click2.ogg"></audio>
      <audio id="sfx-tap-2" class="clip" data-start="8.5" data-duration="0.09" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click1.ogg"></audio>
      <audio id="sfx-tap-3" class="clip" data-start="9.3" data-duration="0.09" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click3.ogg"></audio>
      <audio id="sfx-plus3" class="clip" data-start="9.5" data-duration="0.12" data-track-index="15" data-volume="0.7" src="assets/sfx/interface/bong_001.ogg"></audio>

      <audio id="sfx-tap-4" class="clip" data-start="11.55" data-duration="0.06" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click2.ogg"></audio>
      <audio id="sfx-tap-5" class="clip" data-start="12.15" data-duration="0.09" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click1.ogg"></audio>
      <audio id="sfx-tap-6" class="clip" data-start="12.6" data-duration="0.09" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click3.ogg"></audio>
      <audio id="sfx-tap-7" class="clip" data-start="13.15" data-duration="0.06" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click2.ogg"></audio>
      <audio id="sfx-minus3" class="clip" data-start="13.35" data-duration="0.5" data-track-index="15" data-volume="0.45" src="assets/sfx/interface/error_005.ogg"></audio>

      <audio id="sfx-tap-8" class="clip" data-start="14.7" data-duration="0.09" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click1.ogg"></audio>
      <audio id="sfx-tap-9" class="clip" data-start="15.55" data-duration="0.09" data-track-index="14" data-volume="0.6" src="assets/sfx/ui/click3.ogg"></audio>
      <!-- beat-locked: 15.75s (track lift at 16.02s) -->
      <audio id="sfx-plus50" class="clip" data-start="15.76" data-duration="1.48" data-track-index="16" data-volume="0.6" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>

      <audio id="sfx-push" class="clip" data-start="17.28" data-duration="0.6" data-track-index="13" data-volume="0.5" src="assets/sfx/casino/card-slide-3.ogg"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
